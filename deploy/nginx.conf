# Serves the built site inside the preview container. TLS is handled by Nginx Proxy Manager.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects like /services -> /services/ stay relative, so they work behind the proxy.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

    # nginx drops these in any location that sets its own add_header, so /_astro/ repeats them.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build assets never change under the same name.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The real form handler runs on Cloudflare Pages. On the preview the form shows this message.
    location = /api/contact {
        default_type application/json;
        return 503 '{"ok":false,"error":"This is a preview of the new site, so the form does not send messages yet. Please call the shop at (303) 257-5044."}';
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
