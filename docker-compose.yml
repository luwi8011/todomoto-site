# Preview copy of the site for the shop to review.
#   docker compose up -d --build     build and start (re-run after every git pull)
#   docker compose down              stop and remove
services:
  todomoto-site:
    build:
      context: .
      args:
        # The address the shop will visit (the Nginx Proxy Manager host). Used for share
        # previews and canonical links. Change it before the first build.
        SITE_URL: https://todomoto.wilsonfabrication.com
    container_name: todomoto-site
    restart: unless-stopped
    ports:
      # Nginx Proxy Manager forwards to <docker host IP>:8085. Change 8085 if it's taken.
      - "8085:80"
