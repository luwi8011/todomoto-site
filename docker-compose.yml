# Preview copy of the site for the shop to review, deployed as a Portainer Git stack.
# All settings live in stack.env (port and public address).
#
# Portainer doesn't use stack.env for ${...} substitution in this file, so nothing here is
# templated: the build reads SITE_URL from stack.env directly, and nginx reads PORT at startup.
# Host networking lets nginx listen on PORT without a ports: mapping.
services:
  todomoto-site:
    build: .
    image: todomoto-site:preview
    # Rebuild on every Portainer redeploy instead of reusing the old image.
    pull_policy: build
    container_name: todomoto-site
    restart: unless-stopped
    network_mode: host
    env_file:
      - stack.env
